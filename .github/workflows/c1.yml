name: Angular CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./project

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fix Supabase type dependency for CI
        run: npm install --no-save @supabase/phoenix@0.4.0
      - name: adding environment variables
        run: |
          echo "export const environment = {
            production: true,
            supabaseUrl: '${{ vars.VITE_SUPABASE_URL }}',
            supabaseAnonKey: '${{ vars.VITE_SUPABASE_ANON_KEY }}'
          };" > src/environment/environment.prod.ts

      # - name: Run lint
      #   run: npm run lint
      - name: Skip lint (not configured)
        run: echo "Lint not configured for this project"

      # - name: Run unit tests
      #   run: npx ng test demo --watch=false --browsers=ChromeHeadless
      - name: Skip unit tests (not configured)
        run: echo "Unit tests not configured for this project"

      # - name: Build Angular app
      #   run: npm run build
      - name: Build Angular
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/" --configuration production
      - name: Debug dist folder
        run: ls -la dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/dist/demo/browser
      - name: Create tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag v$(date +'%Y%m%d%') # add %Y%m%d%H%M%S for unique tags
          git push origin --tags
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
